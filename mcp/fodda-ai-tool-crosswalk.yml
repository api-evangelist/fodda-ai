method: derived
source: Derived by aligning the provider-published MCP tool manifest (mcp/fodda-ai-tools-manifest.json, 53 tools;
  live tools/list is OAuth-gated) with the provider-published OpenAPI 3.1 at https://api.fodda.ai/openapi.json (openapi/fodda-ai-openapi.yml,
  157 operations). Bindings are by name and documented semantics (llms-full.txt tool descriptions, the agent-skills
  references/fodda-api.md endpoint map, and the fodda-mcp CHANGELOG); confidence recorded per row.
purpose: 'Make each MCP tool a first-class discovery unit bound to the REST operation(s) that back it, so a bound
  tool inherits that operation''s parameters/requestBody as its real input contract, and so MCP-only and REST-only
  capabilities are recorded instead of silently dropped. The two surfaces are overlapping-but-non-identical projections
  of one data core: 24 tools bind to 41 REST operations, 29 tools have no public REST contract, and 116 REST operations
  (108 of them per-source supplemental snapshots) have no tool.'
