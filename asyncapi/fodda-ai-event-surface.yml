summary: Fodda publishes no AsyncAPI document and no inbound webhook-subscription API. Its event surface is (1)
  a Server-Sent Events endpoint for streaming research, (2) scheduled briefings that Fodda pushes outbound to an
  email address or a Slack incoming-webhook URL supplied when the schedule is created, and (3) MCP/A2A streaming
  flags. The Webhooks pointer is emitted for the documented outbound Slack-webhook delivery; there is no event catalog,
  payload schema or signing documentation to capture, so the asyncapi scoring family is otherwise N/A.
