      quote: Fixed, versioned tool catalog with no dynamic loading, code execution, or filesystem access. Read-only
        graph tools are separated from account-scoped write operations. ... Query text retained in internal usage
        ledger for 12 months for billing and telemetry, then purged; result text is not retained. Zero model training
