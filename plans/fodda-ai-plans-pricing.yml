  overage forgiveness, Pay As They Go for agents at 50 cents per call with no account via Stripe Shared Payment
  Tokens, and Enterprise with custom volume pricing and a dedicated SLA. Per-request prices are machine-readable:
  GET /v1/research/pricing returns 42 billing keys with call counts and USD SPT prices, GET /v1/offerings returns
  84 priced offerings, every OpenAPI operation carries x-fodda-price-usd, and an unauthenticated call answers 402
  with the exact price in cents.'
