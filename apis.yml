  - name: Fodda MCP Server
    description: >-
      Hosted Model Context Protocol server at mcp.fodda.ai exposing 53 tools (tools-manifest.json,
      v1.46.79) over streamable-http (/mcp), SSE (/sse), a curated 17-tool Microsoft Copilot
      endpoint (/copilot) and offering-scoped endpoints, plus a stdio package (npx -y fodda-mcp)
      listed in the official MCP Registry as ai.fodda/mcp-server. Auth is OAuth 2.1 delegated to
      clerk.fodda.ai (RFC 9728 protected-resource metadata on the MCP host, RFC 8414 authorization
      server metadata with dynamic client registration, PKCE S256, device code) or an account API
      key / personal connection URL. Anonymous tools/list returns 401 with a WWW-Authenticate
      resource_metadata challenge, so live input schemas require authenticated introspection.
    humanURL: https://www.fodda.ai/connect
    baseURL: https://mcp.fodda.ai/mcp
    tags:
      - MCP
      - agent-native
      - Knowledge Graphs
      - Research
    properties:
      - type: MCPServer
        url: mcp/fodda-ai-mcp.yml
      - type: MCPServer
        name: Fodda MCP endpoint (Streamable HTTP)
        url: https://mcp.fodda.ai/mcp
      - type: ToolCrosswalk
        url: mcp/fodda-ai-tool-crosswalk.yml
      - type: OAuthScopes
        url: scopes/fodda-ai-scopes.yml
      - type: Documentation
        url: https://www.fodda.ai/connect
      - type: GettingStarted
        url: https://www.fodda.ai/platform-integration-anthropic-claude
  - name: Fodda Research Agent (A2A)
    description: >-
      Agent-to-Agent endpoint at mcp.fodda.ai/a2a (JSONRPC, A2A protocolVersion 0.3.0) discovered
      from https://www.fodda.ai/.well-known/agent-card.json, declaring seven skills — brand
      intelligence, trend search, deep research (async task, poll tasks/get), cross-company and
      per-ticker earnings intelligence, expert consult, and commissioned deliverables. Outside
      agents hand Fodda a natural-language research task and collect the cited result when ready.
      Also listed on a2aregistry.org.
    humanURL: https://www.fodda.ai/agents
    baseURL: https://mcp.fodda.ai/a2a
    tags:
      - A2A
      - agent-native
      - Research
    properties:
      - type: AgentCard
        url: a2a/fodda-ai-a2a.yml
      - type: AgentCard
        name: A2A Agent Card (provider-hosted)
        url: https://www.fodda.ai/.well-known/agent-card.json
      - type: Documentation
        url: https://www.fodda.ai/agents
