aid: fodda-ai
name: Fodda (PSFK)
description: >-
  Fodda is the agent-native research layer built by PSFK, the trend-intelligence publisher, exposing
  250+ expert-curated knowledge graphs (retail, beauty, fashion, sport, food and beverage, travel,
  technology), named-expert "Human Agent" digital twins, earnings-call intelligence across 500+
  consumer-sector companies, and 80+ live institutional data sources (FRED, BEA, BLS, Census, ONS,
  Eurostat, ECB and more) to AI agents. It is reachable three ways from one data core: a REST API at
  api.fodda.ai (OpenAPI 3.1, 157 operations, per-operation price extensions), a hosted MCP server at
  mcp.fodda.ai (streamable-http, SSE, a curated Copilot endpoint, OAuth via Clerk with dynamic client
  registration, plus a stdio package on npm), and an A2A agent at mcp.fodda.ai/a2a discovered from
  /.well-known/agent-card.json. Access is metered per API call ($0.50) with three rails: an X-API-Key
  account key with a free monthly tier, enterprise OIDC bearer tokens, and a zero-onboarding Machine
  Payments Protocol flow in which any unauthenticated request answers HTTP 402 with the exact price
  and a Stripe Shared Payment Token is presented on retry. The catalog itself is published as an Open
  Knowledge Format bundle, an RFC 9727 api-catalog linkset, llms.txt/agents.txt manifests, and ten
  MIT-licensed installable Agent Skills.
