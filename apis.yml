apis:
  - name: Fodda Context & Research API
    description: >-
      REST interface at api.fodda.ai for expert-curated knowledge graphs (search, node retrieval,
      neighbor traversal, evidence, statistics, adjacent-trend discovery), autonomous deep research
      (async job launch + status poll, SSE streaming search, research chat, scheduled briefings
      delivered by email or Slack webhook), brand intelligence, synthetic and human expert analyst
      consults, cross-company earnings intelligence, and 100+ supplemental institutional data
      snapshots. OpenAPI 3.1.0 (info.version 1.7.0, 157 operations) served at
      https://api.fodda.ai/openapi.json; every operation carries x-fodda-price-usd and
      x-fodda-billing-type. Auth: X-API-Key header or a Stripe Shared Payment Token bearer via the
      HTTP 402 Machine Payments Protocol flow; a public tier (health, pricing map, offerings,
      graph catalog, JSON-LD graph preview) needs no credential.
    humanURL: https://www.fodda.ai/api
    baseURL: https://api.fodda.ai
    tags:
      - Knowledge Graphs
      - Trend Research
      - Earnings Intelligence
      - Brand Intelligence
      - Institutional Data
      - Machine Payments
      - agent-native
