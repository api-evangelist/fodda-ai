summary: A rich, real well-known surface across three hosts. www.fodda.ai serves an RFC 9727 api-catalog linkset
  (at /.well-known/api-catalog.json — the extensionless /.well-known/api-catalog 404s), an RFC 9728 protected-resource
  document for the MCP resource, a non-standard MCP discovery document (mcp.json), the canonical A2A agent card
  and a second, older agent document at the legacy path. mcp.fodda.ai serves RFC 9728 protected-resource metadata
  at the root path and at the /mcp and /copilot resource-suffixed paths (all naming clerk.fodda.ai as the authorization
  server), the agent card at both paths, and four MCP offering cards. clerk.fodda.ai — the delegated authorization
  server — serves OIDC discovery, RFC 8414 authorization-server metadata (with a dynamic client registration endpoint)
  and a JWKS. No host serves security.txt, ai-plugin.json, ucp/acp/AAuth documents or an apis.json.
pointer_basis: WellKnown pointer emitted on the strength of the api-catalog linkset, three RFC 9728 documents, the
  RFC 8414/OIDC documents and the agent card. SecurityTxt pointer NOT emitted — RFC 9116 is unimplemented on every
  host. APICatalog pointer emitted to the provider-hosted linkset.
false_positive_watch: app.fodda.ai answers HTTP 200 with the same 12,230-byte application shell for EVERY /.well-known/*
  path, including the negative-control path that cannot exist; every 200 from that host is recorded below as a miss
  (hit_count 0, path_echo_control failed). fodda.ai (apex) 301s every path to www.fodda.ai, so its rows are the
  www rows.
