overlay: 1.0.0
info:
  title: API Evangelist tags + observed-error overlay for the Fodda Context & Research API
  version: 1.0.0
extends: openapi/_original/fodda-ai-openapi.json
x-generated: '2026-09-19'
x-method: generated
x-source: openapi/_original/fodda-ai-openapi.json + live probes of api.fodda.ai on 2026-09-19
x-rationale: 'The provider''s spec declares 157 operations with no tags and only a 200 response each, and nine operationIds
  are duplicated (supplemental__snapshot, supplemental__context, supplemental__economic_snapshot, supplemental__global_snapshot,
  supplemental__uk_snapshot, supplemental__br_snapshot, supplemental__ca_snapshot, supplemental__research_trends,
  supplemental__profile). This overlay groups every operation under a tag derived from its path family and, on every
  secured operation, declares the 401 and 402 responses that api.fodda.ai actually returns (observed live: 402 payment_required
  with a WWW-Authenticate: stripe-spt challenge on unauthenticated calls). The original is never mutated; duplicate
  operationIds are reported, not renamed, because renaming would break the provider''s own tool bindings.'
x-duplicate-operationIds:
- supplemental__economic_snapshot
- supplemental__global_snapshot
- supplemental__uk_snapshot
- supplemental__br_snapshot
- supplemental__snapshot
- supplemental__ca_snapshot
- supplemental__research_trends
- supplemental__profile
- supplemental__context
actions:
- target: $
  description: Declare the tag set used by the per-operation actions.
  update:
    tags:
    - name: System
    - name: Billing & Offerings
    - name: Research
    - name: Knowledge Graphs
    - name: Account
    - name: Brand Intelligence
    - name: Search
    - name: Admin
    - name: Analysts
    - name: Supplemental Data
    - name: Earnings Intelligence
    - name: Copilot
- target: $.components
  description: Add reusable 401/402 responses as observed on api.fodda.ai (2026-09-19).
  update:
    responses:
      Unauthorized:
        description: Authentication required. Observed on mcp.fodda.ai as a JSON-RPC error; on api.fodda.ai an unauthenticated
          request answers 402 instead (MPP).
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: string
      PaymentRequired:
        description: 'Machine Payments Protocol challenge: the exact price for this request in USD and the accepted
          payment method (Stripe Shared Payment Token). Retry with Authorization: Bearer spt_... or an X-API-Key.'
        headers:
          WWW-Authenticate:
            schema:
              type: string
            description: 'Observed value: stripe-spt amount=50 currency=usd (amount in cents).'
          X-Request-Id:
            schema:
              type: string
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - price
              - payment_methods
              - accept
              properties:
                type:
                  type: string
                  enum:
                  - payment_required
                description:
                  type: string
                price:
                  type: object
                  properties:
                    amount:
                      type: integer
                      description: cents
                    currency:
                      type: string
                payment_methods:
                  type: array
                  items:
                    type: string
                payment_methods_detail:
                  type: array
                  items:
                    type: object
                accept:
                  type: string
                endpoints:
                  type: object
                requestId:
                  type: string
