    servers:
    - url: https://api.fodda.ai
  /v1/graphs/{graph_id}/statistics:
    get:
      summary: Search statistics
      description: 'Get metrics and expert quotes.


        Price: $2.50 (billed as standalone_statistics)'
      operationId: search_statistics
