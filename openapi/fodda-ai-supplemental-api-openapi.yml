openapi: 3.2.0
info:
  title: Fodda Context & Research Supplemental API
  description: Complete technical interface for retrieving expert-curated knowledge graphs, real-time institutional data, and autonomous research profiles.
  version: 1.7.0
servers:
- url: https://api.fodda.ai
tags:
- name: Supplemental
paths:
  /v1/supplemental/context:
    post:
      summary: Unified Supplemental Context
      description: 'Unified access to FRED, Census, PubMed, Google Trends, etc. in parallel.


        Price: $2.50 (billed as standalone_supplemental)'
      operationId: unified_supplemental_context
      x-fodda-price-usd: 2.5
      x-fodda-billing-type: standalone_supplemental
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                  description: Search query or research topic
                domain:
                  type: string
                  description: Optional domain hint (retail, beauty, fashion, etc.)
                brands:
                  type: array
                  items:
                    type: string
                  description: Brand names for product lookups
                graph_ids:
                  type: array
                  items:
                    type: string
                  description: Graph IDs from prior search for domain inference
                sources:
                  type: array
                  items:
                    type: string
                  description: Explicit source IDs to execute
                categories:
                  type: array
                  items:
                    type: string
                  description: Category filters
                geo:
                  type: string
                  description: Country code hint (e.g. BR, TH, GB)
                geography:
                  type: string
                  description: Country code or country name (e.g. BR, Brazil, United Kingdom)
                location:
                  type: string
                  description: Location hint
      responses:
        '200':
          description: Unified supplemental data payload with source coverage telemetry
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  domain:
                    type: string
                  sources_queried:
                    type: number
                  sources_returned:
                    type: number
                  sources_succeeded:
                    type: array
                    items:
                      type: string
                  sources_failed:
                    type: array
                    items:
                      type: object
                  sources_skipped:
                    type: array
                    items:
                      type: object
                  source_coverage:
                    type: object
                    properties:
                      considered:
                        type: number
                      selected:
                        type: number
                      attempted:
                        type: number
                      returned:
                        type: number
                      dropped:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            stage:
                              type: string
                              enum:
                              - routing
                              - fetch
                              - consolidate
                              - coherence
                            reason:
                              type: string
                      query_interpreted_as:
                        type: string
                      domain_inference:
                        type: string
                      classifier_path:
                        type: string
                        enum:
                        - regex
                        - gemini
                        - fallback
                      need_adjacency_applied:
                        type: array
                        items:
                          type: string
                  demand_signals:
                    type: object
                  economic_context:
                    type: object
                  market_data:
                    type: object
                  financial_reporting:
                    type: object
                  research_signals:
                    type: object
                  demographic_context:
                    type: object
                  _meta:
                    type: object
      security:
      - apiKey: []
      - stripeSPT: []
      tags:
      - Supplemental
